<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web FPV Simulator - by John</title>
    <link rel="stylesheet" href="style.css">
    <!-- Three.js para sa 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- MENU SCREEN (Gaya sa Screenshot 1 & 2) -->
    <div id="menu-screen">
        <div class="menu-container">
            <h1>Workshop</h1>
            <div class="drone-grid">
                <!-- Placeholder para sa Drone Selection -->
                <div class="drone-card" onclick="startGame()">
                    <img src="feral-x4.jpg" alt="Feral Quads Fenrir X4" onerror="this.src='https://via.placeholder.com/200x150?text=Drone+Image'">
                    <h3>Feral Quads Fenrir X4</h3>
                    <p>Racer - 4 inch</p>
                </div>
            </div>
            <button class="btn" onclick="startGame()">SELECT & FLY</button>
        </div>
    </div>

    <!-- GAME SCREEN (FPV View) -->
    <div id="game-screen" style="display: none;">
        <!-- OSD (On-Screen Display) gaya sa Screenshot 8 -->
        <div id="osd">
            <div class="osd-top-left">
                <p>SIGNAL STRENGTH: 97 %</p>
                <p>SPEED: <span id="speed">0</span> KM/H</p>
                <p>ALTITUDE: <span id="altitude">0</span> M</p>
                <p>FPS: <span id="fps">60</span></p>
            </div>
            <div class="osd-top-right">
                <p>Player 1: Feral Quads Fenrir X4</p>
                <p>LAP: 1 / 3</p>
                <p>TIME: <span id="timer">00:00:00</span></p>
            </div>
            <div class="osd-bottom-left">
                <p>FLIGHT MODE: <span id="flight-mode">ACRO</span></p>
                <p>PRE-ARM</p>
            </div>
            <div class="osd-bottom-right">
                <p>CAMERA: First Person View</p>
                <p>BATTERY: 16.8 V</p>
            </div>
        </div>
        
        <!-- Canvas para sa 3D -->
        <div id="canvas-container"></div>
        
        <!-- Pause/Exit Button -->
        <button id="exit-btn" onclick="exitGame()">EXIT TO WORKSHOP</button>
    </div>

    <!-- Footer para sa Dev Credit -->
    <footer>
        <p>Developed by <strong>John</strong> | Contact: <a href="mailto:johnicebourne@gmail.com">johnicebourne@gmail.com</a></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
